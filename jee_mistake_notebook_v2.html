<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>JEE Mistake Notebook — v2</title>
<style>
:root{--bg:#080a0f;--surface:#10131a;--surface2:#151923;--surface3:#1b202b;--border:#252b38;--border2:#303746;--text:#f3f4f6;--muted:#8f98a8;--blue:#67a8ff;--red:#ff7272;--amber:#ffc857;--green:#42dca0;--purple:#b795ff;--shadow:0 18px 50px rgba(0,0,0,.35);--sidebar:250px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}body{overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;display:flex}.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:linear-gradient(180deg,#10131a,#0d1016);border-right:1px solid var(--border);display:flex;flex-direction:column}.brand{padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.brand-title{font-weight:750;letter-spacing:-.03em}.status{font-size:10px;color:var(--green);border:1px solid rgba(66,220,160,.2);background:rgba(66,220,160,.07);padding:4px 7px;border-radius:999px}.nav{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:4px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:10px;align-items:center;font-size:13px}.nav button:hover{background:var(--surface2);color:var(--text)}.nav button.active{background:var(--surface3);border-color:var(--border2);color:#fff;box-shadow:inset 3px 0 var(--blue)}.nav .section{margin:12px 8px 4px;color:#5f6877;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.sidebar-footer{margin-top:auto;padding:14px;border-top:1px solid var(--border);color:var(--muted);font-size:11px;line-height:1.5}.main{flex:1;min-width:0;height:100%;overflow:hidden}.page{height:100%;display:flex;flex-direction:column}.topbar{min-height:66px;padding:14px 22px;border-bottom:1px solid var(--border);background:rgba(16,19,26,.92);display:flex;align-items:center;justify-content:space-between;gap:12px}.topbar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.02em}.subtle{color:var(--muted);font-size:12px;margin-top:3px}.content{flex:1;overflow:auto;padding:22px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.stat,.card,.panel{background:linear-gradient(180deg,var(--surface),#0e1117);border:1px solid var(--border);border-radius:12px}.stat{padding:17px}.stat .num{font-size:27px;font-weight:750;letter-spacing:-.04em}.stat .label{margin-top:5px;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.1em}.stat.red .num{color:var(--red)}.stat.amber .num{color:var(--amber)}.stat.green .num{color:var(--green)}.card{padding:16px;transition:.15s border,.15s transform,.15s background}.card.clickable{cursor:pointer}.card.clickable:hover{border-color:var(--border2);background:var(--surface2);transform:translateY(-1px)}.panel{overflow:hidden}.panel-head{padding:15px 17px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-title{font-weight:700;font-size:13px}.panel-body{padding:16px}.btn{border:1px solid var(--border2);background:var(--surface2);color:var(--text);min-height:38px;padding:8px 13px;border-radius:8px;font-size:12px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{background:var(--surface3);border-color:#3a4353}.btn.primary{background:#f5f7fb;color:#080a0f;border-color:#f5f7fb}.btn.primary:hover{background:#fff}.btn.danger{color:var(--red);background:rgba(255,114,114,.07);border-color:rgba(255,114,114,.18)}.btn.success{color:var(--green);background:rgba(66,220,160,.07);border-color:rgba(66,220,160,.18)}.btn.small{min-height:31px;padding:5px 9px;font-size:11px}.input,.select,.textarea{width:100%;background:#0c0f15;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 11px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#485367;box-shadow:0 0 0 3px rgba(103,168,255,.06)}.textarea{resize:vertical;min-height:80px}.label{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.09em;margin:0 0 6px;display:block}.field{margin-bottom:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px}.layout{height:calc(100% - 66px);display:grid;grid-template-columns:300px 1fr}.chapter-list{overflow:auto;border-right:1px solid var(--border);padding:12px}.chapter{padding:10px 11px;border:1px solid transparent;border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;margin-bottom:3px}.chapter:hover{background:var(--surface2);color:var(--text)}.chapter.active{background:var(--surface3);color:#fff;border-color:var(--border2)}.mistakes{overflow:auto;padding:20px}.section-title{font-size:11px;font-weight:800;letter-spacing:.1em;margin:3px 0 10px}.section-title.red{color:var(--red)}.section-title.amber{color:var(--amber)}.mistake-card{margin-bottom:10px}.mistake-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge{font-size:9px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:999px}.badge.red{color:var(--red);background:rgba(255,114,114,.1);border:1px solid rgba(255,114,114,.16)}.badge.amber{color:var(--amber);background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.16)}.mistake-title{font-size:14px;font-weight:700;margin:10px 0 5px}.desc{font-size:12px;line-height:1.55;color:var(--muted);white-space:pre-wrap}.meta{font-size:10px;color:var(--muted)}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.tag{font-size:10px;color:#aab3c2;background:#0b0e14;border:1px solid var(--border);border-radius:999px;padding:3px 7px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.photo-count{font-size:10px;color:var(--blue);margin-top:9px}.bars{display:flex;flex-direction:column;gap:11px}.bar-row{display:grid;grid-template-columns:130px 1fr 34px;align-items:center;gap:9px;font-size:11px}.bar-bg{height:7px;background:#202632;border-radius:99px;overflow:hidden}.bar{height:100%;border-radius:99px;background:var(--blue)}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal-bg.open{display:flex}.modal{width:min(760px,100%);max-height:92dvh;background:#0f1219;border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}.modal.wide{width:min(900px,100%)}.modal-head,.modal-foot{padding:15px 18px;border-color:var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-head{border-bottom:1px solid var(--border)}.modal-foot{border-top:1px solid var(--border);background:#0b0e13;justify-content:flex-end}.modal-body{padding:18px;overflow:auto}.modal-title{font-weight:750;font-size:14px}.close{width:34px;height:34px;padding:0;border-radius:8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview-grid{display:flex;gap:9px;flex-wrap:wrap}.preview{position:relative;width:84px;height:84px}.preview img{width:84px;height:84px;object-fit:cover;border-radius:9px;border:1px solid var(--border2);cursor:pointer}.preview button{position:absolute;right:-5px;top:-5px;width:22px;height:22px;min-height:0;padding:0;border-radius:50%;font-size:11px}.gallery{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.gallery img{width:100px;height:100px;object-fit:cover;border-radius:9px;border:1px solid var(--border);cursor:zoom-in}.lightbox img{max-width:94vw;max-height:84vh;object-fit:contain;border-radius:8px}.lightbox{align-items:center}.toast{position:fixed;right:18px;bottom:18px;background:#151a23;border:1px solid var(--border2);box-shadow:var(--shadow);padding:11px 14px;border-radius:9px;font-size:12px;z-index:100;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.mobile-menu{display:none}.kbd{border:1px solid var(--border2);background:#0a0d12;border-radius:5px;padding:2px 5px;font-size:10px;color:#8f98a8}@media(max-width:900px){:root{--sidebar:210px}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:230px 1fr}.two,.three{grid-template-columns:1fr}}@media(max-width:680px){body{overflow:auto}.app{min-height:100dvh;height:auto;display:block}.sidebar{position:fixed;left:-270px;top:0;bottom:0;z-index:40;transition:.2s}.sidebar.open{left:0}.main{height:100dvh}.mobile-menu{display:inline-flex}.topbar{padding:12px 14px}.content{padding:14px}.layout{grid-template-columns:1fr;height:calc(100% - 61px)}.chapter-list{display:none}.form-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.mistakes{padding:14px}}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#2a303c;border-radius:99px}::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div><div class="brand-title">JEE Notebook</div><div class="subtle">Mistake → Revision → Mastery</div></div><span class="status">LOCAL</span></div>
    <nav class="nav">
      <div class="section">Workspace</div>
      <button data-tab="dashboard" onclick="switchTab('dashboard')">⌂ <span>Dashboard</span></button>
      <button data-tab="Physics" onclick="switchTab('Physics')">◈ <span>Physics</span></button>
      <button data-tab="Chemistry" onclick="switchTab('Chemistry')">◈ <span>Chemistry</span></button>
      <button data-tab="Mathematics" onclick="switchTab('Mathematics')">◈ <span>Mathematics</span></button>
      <div class="section">Review</div>
      <button data-tab="revision" onclick="switchTab('revision')">↻ <span>Revision Queue</span></button>
      <button data-tab="search" onclick="switchTab('search')">⌕ <span>Global Search</span></button>
      <button data-tab="statistics" onclick="switchTab('statistics')">▥ <span>Analytics</span></button>
      <div class="section">Data</div>
      <button data-tab="archive" onclick="switchTab('archive')">□ <span>Archive & Trash</span></button>
      <button data-tab="settings" onclick="switchTab('settings')">⚙ <span>Backup & Settings</span></button>
    </nav>
    <div class="sidebar-footer">Everything is stored locally in this browser.<br><span class="kbd">Ctrl+N</span> new entry · <span class="kbd">Ctrl+K</span> search</div>
  </aside>
  <main class="main" id="main"></main>
</div>

<!-- Entry modal -->
<div class="modal-bg" id="entryModal" onclick="backdropClose(event,'entryModal')">
  <section class="modal">
    <header class="modal-head"><span class="modal-title" id="entryModalTitle">New Mistake</span><button class="btn close" onclick="closeModal('entryModal')">✕</button></header>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-grid">
        <div class="field"><label class="label">SUBJECT</label><select class="select" id="fSubject" onchange="updateChapterDropdown()"><option>Physics</option><option>Chemistry</option><option>Mathematics</option></select></div>
        <div class="field"><label class="label">CHAPTER</label><select class="select" id="fChapter"></select></div>
      </div>
      <div class="field"><label class="label">CATEGORY</label><select class="select" id="fCategory"><option>Wrong</option><option>Unattempted</option></select></div>
      <div class="field"><label class="label">QUESTION TITLE / SUMMARY</label><input class="input" id="fTitle" placeholder="e.g. Rolling disc + wedge constraint"></div>
      <div class="field"><label class="label">QUESTION / NOTES</label><textarea class="textarea" id="fDescription" rows="4" placeholder="Write the problem, your observation, or the exact point where you got stuck."></textarea></div>
      <div class="form-grid">
        <div class="field"><label class="label">ROOT CAUSE</label><select class="select" id="fReason"><option>Conceptual mistake</option><option>Formula forgotten</option><option>Calculation error</option><option>Misread question</option><option>Wrong approach</option><option>Careless mistake</option><option>Time pressure</option></select></div>
        <div class="field"><label class="label">TAGS</label><input class="input" id="fTags" placeholder="mechanics, sign-error, PYQ"></div>
      </div>
      <div class="field"><label class="label">CORRECT THOUGHT PROCESS / APPROACH</label><textarea class="textarea" id="fApproach" rows="3" placeholder="What should you notice next time? Keep it exam-actionable."></textarea></div>
      <div class="field"><label class="label">PHOTOS — JPG/PNG/WEBP</label><input class="input" type="file" id="fImages" accept="image/*" multiple onchange="handleImageUpload(event)"><div class="subtle" style="margin:7px 0">Images are resized locally before storage to prevent browser quota problems.</div><div class="preview-grid" id="previewGrid"></div></div>
    </div>
    <footer class="modal-foot"><button class="btn" onclick="closeModal('entryModal')">Cancel</button><button class="btn primary" onclick="saveMistake()">Save Entry</button></footer>
  </section>
</div>

<!-- Reattempt modal -->
<div class="modal-bg" id="reattemptModal" onclick="backdropClose(event,'reattemptModal')">
  <section class="modal wide">
    <header class="modal-head"><span class="modal-title">Re-Attempt Mode</span><button class="btn close" onclick="closeModal('reattemptModal')">✕</button></header>
    <div class="modal-body" id="reattemptBody"></div>
    <footer class="modal-foot" id="reattemptFoot"></footer>
  </section>
</div>

<!-- Lightbox -->
<div class="modal-bg lightbox" id="lightbox" onclick="closeModal('lightbox')"><img id="lightboxImg" alt="Question image"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const DB_NAME='JEENotebookDB_Pro';
const DB_VERSION=2;
const STORE='mistakes';
let db=null, tempImages=[], currentTab='dashboard', activeSubject='Physics', activeChapter='';

const syllabus={
 Physics:['Units, Dimensions & Measurement','Kinematics','Laws of Motion','Work, Energy and Power','Rotational Motion','Gravitation','Properties of Solids & Liquids','Thermodynamics','Kinetic Theory of Gases','Oscillations & Waves','Electrostatics','Current Electricity','Magnetic Effects of Current & Magnetism','Electromagnetic Induction & AC','Electromagnetic Waves','Optics (Ray & Wave)','Dual Nature of Matter & Radiation','Atoms & Nuclei','Electronic Devices','Experimental Skills'],
 Chemistry:['Some Basic Concepts in Chemistry (Mole Concept)','Atomic Structure','Chemical Bonding & Molecular Structure','States of Matter','Chemical Thermodynamics','Solutions','Equilibrium','Redox Reactions & Electrochemistry','Chemical Kinetics','Classification of Elements & Periodicity','Chemical Bonding (Advanced)','Hydrogen','S-Block Elements','P-Block Elements (Group 13-18)','D- and F-Block Elements','Coordination Compounds','Environmental Chemistry','Purification & Characterisation of Organic Compounds','Some Basic Principles of Organic Chemistry (GOC)','Hydrocarbons','Haloalkanes & Haloarenes','Alcohols, Phenols and Ethers','Aldehydes, Ketones and Carboxylic Acids','Organic Compounds Containing Nitrogen','Biomolecules','Polymers','Principles Related to Practical Chemistry'],
 Mathematics:['Sets, Relations and Functions','Complex Numbers & Quadratic Equations','Matrices and Determinants','Permutations and Combinations','Binomial Theorem & Its Simple Applications','Sequence and Series','Limit, Continuity and Differentiability','Integral Calculus (Indefinite & Definite)','Differential Equations','Coordinate Geometry (Straight Lines, Circles, Conic Sections)','Three Dimensional Geometry','Vector Algebra','Statistics and Probability','Trigonometry','Mathematical Reasoning']
};

function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2200)}
function openModal(id='entryModal'){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function backdropClose(e,id){if(e.target.id===id)closeModal(id)}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}

function initDB(){return new Promise((resolve,reject)=>{if(db)return resolve(db);const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});};r.onsuccess=e=>{db=e.target.result;db.onversionchange=()=>db.close();resolve(db)};r.onerror=()=>reject(r.error)})}
function txStore(mode){return db.transaction(STORE,mode).objectStore(STORE)}
function getAllMistakes(){return new Promise(async resolve=>{try{await initDB();const r=txStore('readonly').getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>resolve([])}catch{resolve([])}})}
function getMistake(id){return new Promise(async resolve=>{try{await initDB();const r=txStore('readonly').get(Number(id));r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null)}catch{resolve(null)}})}
function putMistake(data){return new Promise(async(resolve,reject)=>{try{await initDB();const s=txStore('readwrite');const r=s.put(data);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
function addMistake(data){return new Promise(async(resolve,reject)=>{try{await initDB();const s=txStore('readwrite');const r=s.add(data);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
function removeMistake(id){return new Promise(async(resolve,reject)=>{try{await initDB();const r=txStore('readwrite').delete(Number(id));r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}

function setNav(tab){document.querySelectorAll('.nav button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('sidebar').classList.remove('open')}
async function switchTab(tab){currentTab=tab;setNav(tab);const main=document.getElementById('main');if(tab==='dashboard')return renderDashboard(main);if(['Physics','Chemistry','Mathematics'].includes(tab)){activeSubject=tab;activeChapter='';return renderSubject(main,tab)}if(tab==='revision')return renderRevision(main);if(tab==='search')return renderSearch(main);if(tab==='statistics')return renderStats(main);if(tab==='archive')return renderArchive(main);if(tab==='settings')return renderSettings(main)}
function shell(title,sub,body,actions=''){return `<div class="page"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn mobile-menu" onclick="toggleSidebar()">☰</button><div><h1>${esc(title)}</h1>${sub?`<div class="subtle">${esc(sub)}</div>`:''}</div></div><div class="toolbar">${actions}</div></header>${body}</div>`}

async function renderDashboard(el){const all=await getAllMistakes(), a=all.filter(m=>!m.isArchived), wrong=a.filter(m=>m.category==='Wrong').length, un=a.filter(m=>m.category==='Unattempted').length;const p=a.filter(m=>m.subject==='Physics').length,c=a.filter(m=>m.subject==='Chemistry').length,ma=a.filter(m=>m.subject==='Mathematics').length;const recent=[...a].sort((x,y)=>new Date(y.createdAt)-new Date(x.createdAt)).slice(0,5);el.innerHTML=shell('Dashboard','Your active mistake database',`<div class="content"><div class="grid stats"><div class="stat"><div class="num">${a.length}</div><div class="label">ACTIVE MISTAKES</div></div><div class="stat red"><div class="num">${wrong}</div><div class="label">WRONG</div></div><div class="stat amber"><div class="num">${un}</div><div class="label">UNATTEMPTED</div></div><div class="stat green"><div class="num">${a.filter(m=>(m.reattemptHistory||[]).some(x=>x.result==='Correct')).length}</div><div class="label">SOLVED IN REATTEMPT</div></div></div><div class="grid two" style="margin-top:14px"><div class="panel"><div class="panel-head"><span class="panel-title">Subject Distribution</span></div><div class="panel-body"><div class="bars">${bar('Physics',p,a.length)}${bar('Chemistry',c,a.length)}${bar('Mathematics',ma,a.length)}</div></div></div><div class="panel"><div class="panel-head"><span class="panel-title">Recent Entries</span><button class="btn small" onclick="switchTab('revision')">Review queue</button></div><div class="panel-body">${recent.length?recent.map(m=>miniMistake(m)).join(''):'<div class="empty" style="padding:30px">No mistakes yet. Add the first one.</div>'}</div></div></div><div class="card" style="margin-top:14px"><div style="font-size:13px;font-weight:750">Execution rule</div><div class="desc" style="margin-top:6px">Log the exact failure, re-attempt without looking at the solution, then convert repeated errors into a concrete exam action.</div></div></div>`,'<button class="btn primary" onclick="openNewEntry()">＋ New Entry</button>')}
function bar(name,n,total){const pct=total?Math.round(n/total*100):0;return `<div class="bar-row"><span>${name}</span><div class="bar-bg"><div class="bar" style="width:${pct}%"></div></div><b>${n}</b></div>`}
function miniMistake(m){return `<div style="padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="openReattempt(${m.id})"><div style="display:flex;justify-content:space-between;gap:10px"><b style="font-size:12px">${esc(m.title)}</b><span class="badge ${m.category==='Wrong'?'red':'amber'}">${esc(m.category)}</span></div><div class="meta" style="margin-top:4px">${esc(m.subject)} · ${esc(m.chapter)}</div></div>`}

async function renderSubject(el,subject){const chapters=syllabus[subject];el.innerHTML=shell(subject,`${chapters.length} chapters` ,`<div class="layout"><div class="chapter-list" id="chapterList">${chapters.map(ch=>`<div class="chapter" data-chapter="${esc(ch)}" onclick="selectChapter(${JSON.stringify(subject)},${JSON.stringify(ch)})">${esc(ch)}</div>`).join('')}</div><section class="mistakes" id="mistakeArea"><div class="empty">Select a chapter to inspect mistakes.</div></section></div>`,'<button class="btn primary" onclick="openNewEntry()">＋ New Entry</button>')}
async function selectChapter(subject,chapter){activeSubject=subject;activeChapter=chapter;document.querySelectorAll('.chapter').forEach(x=>x.classList.toggle('active',x.dataset.chapter===chapter));const all=await getAllMistakes(), list=all.filter(m=>!m.isArchived&&m.subject===subject&&m.chapter===chapter);const wrong=list.filter(m=>m.category==='Wrong'),un=list.filter(m=>m.category==='Unattempted');document.getElementById('mistakeArea').innerHTML=`<div style="margin-bottom:20px"><div class="section-title red">WRONG QUESTIONS · ${wrong.length}</div>${wrong.length?wrong.map(renderMistakeCard).join(''):'<div class="empty" style="padding:28px">No wrong questions in this chapter.</div>'}</div><div><div class="section-title amber">UNATTEMPTED · ${un.length}</div>${un.length?un.map(renderMistakeCard).join(''):'<div class="empty" style="padding:28px">No unattempted questions in this chapter.</div>'}</div>`}
function renderMistakeCard(m){const tags=(m.tags||'').split(',').map(x=>x.trim()).filter(Boolean);const imgs=m.images||[];const attempts=m.reattemptHistory||[];const solved=attempts.filter(x=>x.result==='Correct').length;return `<article class="card clickable mistake-card"><div onclick="openReattempt(${m.id})"><div class="mistake-head"><span class="badge ${m.category==='Wrong'?'red':'amber'}">${esc(m.category)}</span><span class="meta">${esc(m.reason||'General')}</span></div><div class="mistake-title">${esc(m.title||'Untitled Mistake')}</div><div class="desc">${esc(m.description||'No description')}</div>${imgs.length?`<div class="photo-count">▧ ${imgs.length} photo${imgs.length>1?'s':''} attached</div>`:''}${solved?`<div class="photo-count" style="color:var(--green)">✓ ${solved} successful re-attempt${solved>1?'s':''}</div>`:''}<div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><div class="actions"><button class="btn small" onclick="event.stopPropagation();editMistake(${m.id})">Edit</button><button class="btn small danger" onclick="event.stopPropagation();archiveMistake(${m.id})">Archive</button></div></article>`}

function openNewEntry(){openEntry(null)}
async function editMistake(id){const m=await getMistake(id);if(m)openEntry(m)}
function openEntry(m){tempImages=[];document.getElementById('entryModalTitle').textContent=m?'Edit Mistake':'New Mistake';document.getElementById('editId').value=m?.id||'';document.getElementById('fSubject').value=m?.subject||activeSubject||'Physics';updateChapterDropdown();document.getElementById('fChapter').value=m?.chapter||activeChapter||syllabus[document.getElementById('fSubject').value][0];document.getElementById('fCategory').value=m?.category||'Wrong';document.getElementById('fTitle').value=m?.title||'';document.getElementById('fDescription').value=m?.description||'';document.getElementById('fReason').value=m?.reason||'Conceptual mistake';document.getElementById('fTags').value=m?.tags||'';document.getElementById('fApproach').value=m?.correctApproach||'';tempImages=[...(m?.images||[])];renderPreviews();openModal('entryModal')}
function updateChapterDropdown(){const s=document.getElementById('fSubject').value;document.getElementById('fChapter').innerHTML=syllabus[s].map(ch=>`<option value="${esc(ch)}">${esc(ch)}</option>`).join('')}
function handleImageUpload(e){const files=[...e.target.files||[]];files.forEach(file=>{if(!file.type.startsWith('image/'))return;resizeImage(file).then(data=>{tempImages.push(data);renderPreviews()}).catch(()=>showToast('Could not read image'))});e.target.value=''}
function resizeImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onload=()=>{const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.82))};img.onerror=reject;img.src=r.result};r.readAsDataURL(file)})}
function renderPreviews(){const c=document.getElementById('previewGrid');c.innerHTML=tempImages.map((img,i)=>`<div class="preview"><img src="${img}" alt="Preview ${i+1}" onclick="openImage(${i})"><button class="btn danger" onclick="removeTempImage(${i})">×</button></div>`).join('')}
function removeTempImage(i){tempImages.splice(i,1);renderPreviews()}
function openImage(index,arr=tempImages){const src=arr[index];if(!src)return;document.getElementById('lightboxImg').src=src;openModal('lightbox')}
async function saveMistake(){const title=document.getElementById('fTitle').value.trim();if(!title){showToast('Give the mistake a title');document.getElementById('fTitle').focus();return}const id=document.getElementById('editId').value;const old=id?await getMistake(id):null;const data={...(old||{}),subject:document.getElementById('fSubject').value,chapter:document.getElementById('fChapter').value,category:document.getElementById('fCategory').value,title,description:document.getElementById('fDescription').value.trim(),reason:document.getElementById('fReason').value,tags:document.getElementById('fTags').value.trim(),correctApproach:document.getElementById('fApproach').value.trim(),images:[...tempImages],isArchived:old?.isArchived||false,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),reattemptHistory:old?.reattemptHistory||[]};try{if(id){data.id=Number(id);await putMistake(data)}else{await addMistake(data)}closeModal('entryModal');showToast(id?'Entry updated':'Mistake saved');if(['Physics','Chemistry','Mathematics'].includes(currentTab)){const keepSubject=currentTab,keepChapter=data.chapter;await switchTab(keepSubject);await selectChapter(keepSubject,keepChapter)}else{await switchTab(currentTab)}}catch(e){console.error(e);showToast('Could not save — browser storage may be full')}}
async function archiveMistake(id){const m=await getMistake(id);if(!m)return;m.isArchived=!m.isArchived;await putMistake(m);showToast(m.isArchived?'Archived':'Restored');switchTab(currentTab)}

async function openReattempt(id){const m=await getMistake(id);if(!m)return;const imgs=m.images||[];const attempts=m.reattemptHistory||[];document.getElementById('reattemptBody').innerHTML=`<div class="mistake-head"><span class="badge ${m.category==='Wrong'?'red':'amber'}">${esc(m.category)}</span><span class="meta">${esc(m.reason||'General')}</span></div><h2 style="font-size:18px;margin:11px 0 5px">${esc(m.title)}</h2><div class="meta">${esc(m.subject)} · ${esc(m.chapter)}</div>${imgs.length?`<div class="gallery">${imgs.map((x,i)=>`<img src="${x}" alt="Question photo ${i+1}" onclick="openReattemptImage(${i},${m.id})">`).join('')}</div>`:''}<div class="card" style="margin-top:12px"><div class="label">PROBLEM / NOTES</div><div class="desc" style="color:var(--text);font-size:13px">${esc(m.description||'No description')}</div></div><div id="solution" class="card" style="margin-top:12px;display:none;border-color:rgba(66,220,160,.2);background:rgba(66,220,160,.035)"><div class="label" style="color:var(--green)">CORRECT APPROACH</div><div class="desc" style="color:var(--text);font-size:13px">${esc(m.correctApproach||'No approach recorded.')}</div></div>${attempts.length?`<div style="margin-top:14px"><div class="label">ATTEMPT HISTORY</div>${attempts.slice().reverse().map(a=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:11px"><span style="color:${a.result==='Correct'?'var(--green)':'var(--red)'}">${a.result==='Correct'?'✓':'✕'} ${esc(a.result)}</span><span class="meta" style="float:right">${new Date(a.date).toLocaleString()}</span></div>`).join('')}</div>`:''}`;document.getElementById('reattemptFoot').innerHTML=`<button class="btn" onclick="document.getElementById('solution').style.display='block'">Reveal Approach</button><button class="btn danger" onclick="recordReattempt(${m.id},'Wrong')">Still Wrong</button><button class="btn success" onclick="recordReattempt(${m.id},'Correct')">✓ Solved</button>`;openModal('reattemptModal')}
async function openReattemptImage(i,id){const m=await getMistake(id);if(m)openImage(i,m.images||[])}
async function recordReattempt(id,result){const m=await getMistake(id);if(!m)return;m.reattemptHistory=m.reattemptHistory||[];m.reattemptHistory.push({date:new Date().toISOString(),result});if(result==='Correct'){m.lastSolvedAt=new Date().toISOString()}await putMistake(m);closeModal('reattemptModal');showToast(result==='Correct'?'Recorded: solved':'Recorded: still wrong');switchTab(currentTab)}

async function renderRevision(el){const a=(await getAllMistakes()).filter(m=>!m.isArchived);const due=[...a].sort((x,y)=>{const ax=(x.reattemptHistory||[]).filter(h=>h.result==='Correct').length,ay=(y.reattemptHistory||[]).filter(h=>h.result==='Correct').length;return ax-ay});el.innerHTML=shell('Revision Queue',`${due.length} active mistakes · attack the recurring errors first`,`<div class="content">${due.length?due.map(renderMistakeCard).join(''):'<div class="empty">Queue is empty. Good. Now protect that state.</div>'}</div>`)}
async function renderSearch(el){el.innerHTML=shell('Global Search','Search title, description, chapter, tags, or root cause',`<div class="content"><div class="panel"><div class="panel-body"><input class="input" id="searchInput" placeholder="Search…" oninput="executeSearch(this.value)"></div></div><div id="searchResults" style="margin-top:14px"><div class="empty">Type to search your active notebook.</div></div></div>`)}
async function executeSearch(q){const box=document.getElementById('searchResults');if(!box)return;if(!q.trim()){box.innerHTML='<div class="empty">Type to search your active notebook.</div>';return}const x=q.toLowerCase();const all=await getAllMistakes();const hits=all.filter(m=>!m.isArchived&&[m.title,m.description,m.tags,m.chapter,m.reason,m.subject].some(v=>String(v||'').toLowerCase().includes(x)));box.innerHTML=hits.length?hits.map(renderMistakeCard).join(''):`<div class="empty">No matching mistakes.</div>`}
async function renderStats(el){const a=(await getAllMistakes()).filter(m=>!m.isArchived), causes={};a.forEach(m=>causes[m.reason]=(causes[m.reason]||0)+1);const top=Object.entries(causes).sort((x,y)=>y[1]-x[1]);const solved=a.reduce((n,m)=>n+(m.reattemptHistory||[]).filter(h=>h.result==='Correct').length,0);el.innerHTML=shell('Analytics','Patterns in your mistakes — not just a raw count',`<div class="content"><div class="grid three"><div class="stat"><div class="num">${a.length}</div><div class="label">ACTIVE</div></div><div class="stat green"><div class="num">${solved}</div><div class="label">SUCCESSFUL RE-ATTEMPTS</div></div><div class="stat red"><div class="num">${a.filter(m=>m.category==='Wrong').length}</div><div class="label">WRONG</div></div></div><div class="panel" style="margin-top:14px"><div class="panel-head"><span class="panel-title">Root Cause Breakdown</span></div><div class="panel-body"><div class="bars">${top.length?top.map(([k,n])=>bar(k,n,a.length)).join(''):'<div class="empty" style="padding:25px">No data yet.</div>'}</div></div></div><div class="grid three" style="margin-top:14px">${['Physics','Chemistry','Mathematics'].map(s=>{const n=a.filter(m=>m.subject===s).length;const r=a.filter(m=>m.subject===s&&m.category==='Wrong').length;return `<div class="card"><div style="font-weight:750;font-size:13px">${s}</div><div style="font-size:25px;font-weight:750;margin-top:8px">${n}</div><div class="meta">${r} wrong · ${n-r} unattempted</div></div>`}).join('')}</div></div>`)}
async function renderArchive(el){const all=await getAllMistakes(),a=all.filter(m=>m.isArchived);el.innerHTML=shell('Archive & Trash',`${a.length} archived entries`,`<div class="content">${a.length?a.map(m=>`<div class="card" style="margin-bottom:10px"><div class="mistake-head"><b style="font-size:13px">${esc(m.title)}</b><span class="meta">${esc(m.subject)}</span></div><div class="actions"><button class="btn small" onclick="archiveMistake(${m.id})">Restore</button><button class="btn small danger" onclick="permanentDelete(${m.id})">Delete permanently</button></div></div>`).join(''):'<div class="empty">Archive is clean.</div>'}</div>`)}
async function permanentDelete(id){if(!confirm('Permanently delete this entry? This cannot be undone.'))return;await removeMistake(id);showToast('Deleted permanently');switchTab('archive')}

async function renderSettings(el){const all=await getAllMistakes();const imageCount=all.reduce((n,m)=>n+(m.images||[]).length,0);el.innerHTML=shell('Backup & Settings','Protect your notebook before changing devices',`<div class="content"><div class="grid two"><div class="card"><div style="font-weight:750">Export complete backup</div><div class="desc" style="margin:6px 0 13px">Includes mistakes, attempt history and attached images.</div><button class="btn primary" onclick="exportBackup()">↓ Export JSON</button></div><div class="card"><div style="font-weight:750">Import backup</div><div class="desc" style="margin:6px 0 13px">Import entries from a previous JSON backup. Existing entries are kept.</div><input class="input" type="file" accept="application/json,.json" onchange="importBackup(event)"></div></div><div class="grid three" style="margin-top:14px"><div class="stat"><div class="num">${all.length}</div><div class="label">TOTAL STORED</div></div><div class="stat"><div class="num">${imageCount}</div><div class="label">ATTACHED PHOTOS</div></div><div class="stat"><div class="num">${all.filter(m=>m.isArchived).length}</div><div class="label">ARCHIVED</div></div></div><div class="card" style="margin-top:14px"><div style="font-weight:750">Keyboard shortcuts</div><div class="desc" style="margin-top:7px"><span class="kbd">Ctrl+N</span> create entry &nbsp; <span class="kbd">Ctrl+K</span> open search &nbsp; <span class="kbd">Esc</span> close modal</div></div></div>`)}
async function exportBackup(){const all=await getAllMistakes();const payload={app:'JEE Mistake Notebook',version:2,exportedAt:new Date().toISOString(),entries:all};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`jee-notebook-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Backup exported')}
async function importBackup(e){const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());const entries=Array.isArray(data)?data:data.entries;if(!Array.isArray(entries))throw Error('Invalid backup');let count=0;for(const raw of entries){const item={...raw};delete item.id;item.createdAt=item.createdAt||new Date().toISOString();item.updatedAt=new Date().toISOString();item.isArchived=!!item.isArchived;item.reattemptHistory=Array.isArray(item.reattemptHistory)?item.reattemptHistory:[];item.images=Array.isArray(item.images)?item.images:[];await addMistake(item);count++}showToast(`Imported ${count} entries`);switchTab('dashboard')}catch(err){console.error(err);showToast('Invalid backup file')}e.target.value=''}

function setup(){updateChapterDropdown();switchTab('dashboard');window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal('entryModal');closeModal('reattemptModal');closeModal('lightbox')}if(e.ctrlKey&&e.key.toLowerCase()==='n'){e.preventDefault();openNewEntry()}if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();switchTab('search')}})}
initDB().then(setup).catch(err=>{console.error(err);document.getElementById('main').innerHTML=shell('Storage error','IndexedDB could not be opened',`<div class="content"><div class="empty">Your browser blocked local storage for this page. Open the file in a normal browser tab or serve it from localhost.</div></div>`)})
</script>
</body>
