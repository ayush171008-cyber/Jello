<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHYME LAB — Monochrome Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#09090B',
                        charcoal: '#121215',
                        surface: '#18181B',
                        bordercolor: '#27272A',
                        muted: '#71717A',
                        chalk: '#FAFAFA'
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                        sans: ['Inter', 'sans-serif']

                }

        }

    <style>
        body { background-color: #09090B; color: #FAFAFA; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #09090B; }
        ::-webkit-scrollbar-thumb { background: #27272A; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="bg-obsidian text-chalk antialiased selection:bg-chalk selection:text-obsidian">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- MOCK / PERSISTENT STORAGE ENGINE ---
        const STORAGE_KEY = 'rhyme_lab_pro_monochrome_v1';

        const DEFAULT_STATE = {
            apiKey: '',
            model: 'gemini-2.5-flash',
            history: [],
            savedRhymes: [],
            wordplayList: [],
            problemStats: Array.from({ length: 14 }, (_, i) => ({
                id: i + 1,
                attempts: 0,
                correct: 0,
                totalScore: 0,
                lastPracticed: null
            })),
            settings: {
                defaultMode: 'find',
                defaultProblem: 1,
                defaultTopic: 'Philosophy',
                showIpa: true,
                showBreakdown: true,
                soundEnabled: true,
                autoAdvance: false
            }
        };

        function loadAppState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    return { ...DEFAULT_STATE, ...parsed };
                }
            } catch (e) {
                console.error("Failed to load persistence", e);
            }
            return DEFAULT_STATE;
        }

        function saveAppState(state) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error("Failed to save persistence", e);
            }
        }

        // --- PHONETIC & SCORING ENGINE ---
        const TOPICS = [
            'Philosophy', 'Psychology', 'Politics', 'History', 'Science', 'Technology',
            'Literature', 'Economics', 'Society', 'Street life', 'Relationships',
            'Personal struggles', 'Success', 'Ambition', 'Mythology', 'Religion', 'Abstract concepts', 'Random'
        ];

        const TARGET_POOL = {
            1: ["Flow", "Mind", "Grid", "Truth", "Spark"],
            2: ["Power move", "High stakes", "Cold world", "Deep thought", "Real talk"],
            3: ["Calculate the method", "Architect the future", "Manifest the vision", "Navigate the system", "Operate in silence"],
            4: ["Multidimensional frequency", "Algorithmic execution", "Philosophical abstraction", "Uncompromising dedication", "Psychological resonance"],
            5: ["Unprecedented historical momentum", "Calculated precision in the darkness", "Mathematical structure of the cosmos", "Metaphysical freedom of the spirit"],
            6: ["Extraordinary architectural precision", "Uncompromising dedication to the mission", "Multidimensional frequency modulation", "Psychological warfare on the intellect"],
            7: ["Unprecedented historical paradigm shift", "Extraordinary architectural precision in design", "Mathematical structure of the universal code", "Metaphysical freedom of the conscious spirit"],
            8: ["Unprecedented historical paradigm shift in motion", "Extraordinary architectural precision in design and build", "Mathematical structure of the universal code unlocked", "Metaphysical freedom of the conscious spirit unbound"],
            9: ["Unprecedented historical paradigm shift in motion today", "Extraordinary architectural precision in design and build mechanics", "Mathematical structure of the universal code unlocked completely", "Metaphysical freedom of the conscious spirit unbound forever"],
            10: ["Unprecedented historical paradigm shift in motion today right now", "Extraordinary architectural precision in design and build mechanics working", "Mathematical structure of the universal code unlocked completely forever", "Metaphysical freedom of the conscious spirit unbound forever rising"],
            11: ["Unprecedented historical paradigm shift in motion today right now moving fast", "Extraordinary architectural precision in design and build mechanics working hard", "Mathematical structure of the universal code unlocked completely forever shining", "Metaphysical freedom of the conscious spirit unbound forever rising higher"],
            12: ["Unprecedented historical paradigm shift in motion today right now moving extremely fast", "Extraordinary architectural precision in design and build mechanics working very hard", "Mathematical structure of the universal code unlocked completely forever shining brightly", "Metaphysical freedom of the conscious spirit unbound forever rising higher today"],
            13: ["Unprecedented historical paradigm shift in motion today right now moving extremely fast ahead", "Extraordinary architectural precision in design and build mechanics working very hard daily", "Mathematical structure of the universal code unlocked completely forever shining brightly now", "Metaphysical freedom of the conscious spirit unbound forever rising higher today shining"],
            14: ["Unprecedented historical paradigm shift in motion today right now moving extremely fast ahead forever", "Extraordinary architectural precision in design and build mechanics working very hard daily now", "Mathematical structure of the universal code unlocked completely forever shining brightly now always", "Metaphysical freedom of the conscious spirit unbound forever rising higher today shining forever"]
        };

        function countSyllables(text) {
            if (!text) return 0;
            const clean = text.toLowerCase().replace(/[^a-z\s]/g, '').trim();
            if (!clean) return 0;
            const words = clean.split(/\s+/);
            let total = 0;
            words.forEach(word => {
                let w = word;
                if (w.length <= 3) { total += 1; return; }
                w = w.replace(/(?:[^laeiouy]|ed|es|e)$/i, '');
                w = w.replace(/^y/i, '');
                const matches = w.match(/[aeiouy]{1,2}/g);
                total += matches ? matches.length : 1;
            });
            return Math.max(1, total);
        }

        async function evaluateRhymeAI(apiKey, model, target, submission, problemNum, mode, topic) {
            const targetSyl = problemNum;
            const subSyl = countSyllables(submission);
            
            // If API key is present, try Gemini
            if (apiKey && apiKey.trim().length > 5) {
                try {
                    const prompt = `You are an expert computational linguist, phonetics specialist, and professional hip-hop rap writing coach.
Evaluate this rhyming submission against the target phrase. Return ONLY a valid JSON object.

Target Phrase: "${target}"
Required Syllables: ${targetSyl}
Submitted Answer: "${submission}"
Actual Submitted Syllables: ${subSyl}
Practice Mode: ${mode}
Topic: ${topic}

Return strict JSON with this exact schema:
{
  "submittedSyl": number,
  "sylAccuracyScore": number (0 to 20),
  "phoneticScore": number (0 to 35),
  "stressScore": number (0 to 15),
  "originalityScore": number (0 to 15),
  "usabilityScore": number (0 to 15),
  "totalScore": number (0 to 100),
  "rhymeClassification": "Perfect" | "Multisyllabic" | "Slant" | "Assonance" | "Weak",
  "targetPronunciation": string (IPA or phonetic representation),
  "subPronunciation": string (IPA or phonetic representation),
  "syllableBreakdown": ["syl1", "syl2", ...],
  "feedback": "Concise, expert coaching feedback on flow, phonetic matching, and stress alignment."
}`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json", temperature: 0.3 }
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) {
                            const parsed = JSON.parse(text);
                            return parsed;
                        }
                    }
                } catch (err) {
                    console.warn("API evaluation failed, falling back to heuristic engine:", err);
                }
            }

            // Fallback Heuristic Scoring Engine
            const sylDiff = Math.abs(targetSyl - subSyl);
            let sylScore = Math.max(0, 20 - (sylDiff * 5));
            
            // Phonetic heuristic (check ending letter similarity & vowel presence)
            let phoneticScore = 25;
            const tEnd = target.slice(-3).toLowerCase();
            const sEnd = submission.slice(-3).toLowerCase();
            if (tEnd === sEnd) phoneticScore = 35;
            else if (target.slice(-1) === submission.slice(-1)) phoneticScore = 30;

            let stressScore = subSyl === targetSyl ? 15 : 10;
            let originalityScore = submission.length > 10 ? 15 : 10;
            let usabilityScore = sylDiff === 0 ? 15 : 8;

            let total = sylScore + phoneticScore + stressScore + originalityScore + usabilityScore;
            let classification = sylDiff === 0 ? (phoneticScore >= 30 ? "Multisyllabic" : "Slant") : "Weak";

            return {
                submittedSyl: subSyl,
                sylAccuracyScore: sylScore,
                phoneticScore: phoneticScore,
                stressScore: stressScore,
                originalityScore: originalityScore,
                usabilityScore: usabilityScore,
                totalScore: Math.min(100, Math.max(10, total)),
                rhymeClassification: classification,
                targetPronunciation: `[${target.split(' ').map(w => w.toUpperCase()).join(' ')}]`,
                subPronunciation: `[${submission.split(' ').map(w => w.toUpperCase()).join(' ')}]`,
                syllableBreakdown: submission.split(' '),
                feedback: sylDiff === 0 
                    ? "Solid syllable match! The cadence locks into the target rhythm. Focus on crisper vowel resonance on the tail ends for maximum impact."
                    : `Syllable mismatch: Target requires ${targetSyl} syllables, but your submission has ${subSyl}. Adjust length to improve flow.`
            };
        }

        // --- MAIN APP COMPONENT ---
        function App() {
            const [state, setState] = useState(loadAppState);
            const [activeTab, setActiveTab] = useState('studio'); // studio, wordplay, vault, stats
            const [currentProblem, setCurrentProblem] = useState(state.settings.defaultProblem || 1);
            const [currentMode, setCurrentMode] = useState(state.settings.defaultMode || 'find');
            const [currentTopic, setCurrentTopic] = useState(state.settings.defaultTopic || 'Philosophy');
            
            // Practice State
            const [targetPhrase, setTargetPhrase] = useState('');
            const [userAnswer, setUserAnswer] = useState('');
            const [lastResult, setLastResult] = useState(null);
            const [isEvaluating, setIsEvaluating] = useState(false);
            const [showHint, setShowHint] = useState(false);
            
            // Reflex Timer State
            const [timerActive, setTimerActive] = useState(false);
            const [timeLeft, setTimeLeft] = useState(30);
            const [reflexCount, setReflexCount] = useState(0);
            const [reflexSubmissions, setReflexSubmissions] = useState([]);

            // API Testing State
            const [testStatus, setTestStatus] = useState(null); // 'success' | 'error' | 'testing'
            const [showApiKey, setShowApiKey] = useState(false);

            // Sync state changes to localStorage
            useEffect(() => {
                saveAppState(state);
            }, [state]);

            // Generate new target when problem or mode changes
            useEffect(() => {
                generateNewExercise();
            }, [currentProblem, currentMode]);

            function generateNewExercise() {
                const pool = TARGET_POOL[currentProblem] || TARGET_POOL[1];
                const rand = pool[Math.floor(Math.random() * pool.length)];
                setTargetPhrase(rand);
                setUserAnswer('');
                setLastResult(null);
                setShowHint(false);
                setTimerActive(false);
            }

            // Handle Submission
            async function handleSubmit(e) {
                if (e) e.preventDefault();
                if (!userAnswer.trim() || isEvaluating) return;

                setIsEvaluating(true);
                const evalResult = await evaluateRhymeAI(
                    state.apiKey,
                    state.model,
                    targetPhrase,
                    userAnswer,
                    currentProblem,
                    currentMode,
                    currentTopic
                );

                setLastResult(evalResult);
                setIsEvaluating(false);

                // Update Stats & History
                setState(prev => {
                    const newHistoryItem = {
                        id: 'hist_' + Date.now(),
                        timestamp: new Date().toISOString(),
                        problem: currentProblem,
                        mode: currentMode,
                        target: targetPhrase,
                        submission: userAnswer,
                        score: evalResult.totalScore,
                        classification: evalResult.rhymeClassification
                    };

                    const updatedStats = prev.problemStats.map(stat => {
                        if (stat.id === currentProblem) {
                            const attempts = stat.attempts + 1;
                            const isCorrect = evalResult.totalScore >= 75;
                            const correct = stat.correct + (isCorrect ? 1 : 0);
                            const totalScore = stat.totalScore + evalResult.totalScore;
                            return { ...stat, attempts, correct, totalScore, lastPracticed: new Date().toISOString() };
                        }
                        return stat;
                    });

                    return {
                        ...prev,
                        history: [newHistoryItem, ...prev.history],
                        problemStats: updatedStats
                    };
                });
            }

            // Save to Vault
            function saveToVault() {
                if (!userAnswer.trim()) return;
                const newItem = {
                    id: 'vault_' + Date.now(),
                    phrase: userAnswer,
                    target: targetPhrase,
                    problem: currentProblem,
                    topic: currentTopic,
                    score: lastResult ? lastResult.totalScore : 0,
                    date: new Date().toLocaleDateString()
                };
                setState(prev => ({
                    ...prev,
                    savedRhymes: [newItem, ...prev.savedRhymes]
                }));
                alert("Saved to Rhyme Vault!");
            }

            // Test API Connection
            async function testApiKey() {
                if (!state.apiKey.trim()) {
                    setTestStatus('error');
                    return;
                }
                setTestStatus('testing');
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${state.model}:generateContent?key=${state.apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: "Ping" }] }] })
                    });
                    if (res.ok) {
                        setTestStatus('success');
                    } else {
                        setTestStatus('error');
                    }
                } catch {
                    setTestStatus('error');
                }
            }

            // Calculations for Stats
            const totalAttempts = state.problemStats.reduce((acc, curr) => acc + curr.attempts, 0);
            const totalScoreSum = state.problemStats.reduce((acc, curr) => acc + curr.totalScore, 0);
            const overallAvgScore = totalAttempts > 0 ? Math.round(totalScoreSum / totalAttempts) : 0;
            const overallAccuracy = totalAttempts > 0 ? Math.round((state.problemStats.reduce((acc, curr) => acc + curr.correct, 0) / totalAttempts) * 100) : 0;

            return (
                <div className="min-h-screen bg-obsidian text-chalk flex flex-col font-sans">
                    
                    {/* TOP HEADER BAR */}
                    <header className="border-b border-bordercolor bg-charcoal/80 backdrop-blur sticky top-0 z-30 px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center space-x-4">
                            <div className="flex items-center space-x-2">
                                <div className="w-3 h-3 bg-chalk rounded-full animate-pulse"></div>
                                <h1 className="font-mono font-bold tracking-wider text-lg uppercase">Rhyme Lab</h1>
                            </div>
                            <span className="text-xs font-mono text-muted border border-bordercolor px-2 py-0.5 rounded">STUDIO v2.5</span>
                        </div>

                        {/* NAVIGATION TABS */}
                        <nav className="hidden md:flex items-center space-x-1 bg-obsidian border border-bordercolor p-1 rounded-lg">
                            {[
                                { id: 'studio', label: 'Studio' },
                                { id: 'wordplay', label: 'Wordplay Lab' },
                                { id: 'vault', label: `Vault (${state.savedRhymes.length})` },
                                { id: 'stats', label: 'Stats & Setup' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`px-4 py-1.5 text-xs font-mono rounded transition-colors ${
                                        activeTab === tab.id
                                            ? 'bg-chalk text-obsidian font-bold'
                                            : 'text-muted hover:text-chalk hover:bg-surface'
                                    }`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </nav>

                        {/* QUICK STATS PILL */}
                        <div className="flex items-center space-x-3 text-xs font-mono">
                            <div className="hidden lg:flex items-center space-x-2 bg-surface border border-bordercolor px-3 py-1.5 rounded">
                                <span className="text-muted">DRILLS:</span>
                                <span className="font-bold">{totalAttempts}</span>
                            </div>
                            <div className="flex items-center space-x-2 bg-surface border border-bordercolor px-3 py-1.5 rounded">
                                <span className="text-muted">AVG:</span>
                                <span className="font-bold">{overallAvgScore}%</span>
                            </div>
                        </div>
                    </header>

                    {/* MOBILE NAV */}
                    <div className="md:hidden flex border-b border-bordercolor bg-charcoal overflow-x-auto">
                        {[
                            { id: 'studio', label: 'Studio' },
                            { id: 'wordplay', label: 'Wordplay' },
                            { id: 'vault', label: 'Vault' },
                            { id: 'stats', label: 'Stats & Setup' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex-1 py-3 text-xs font-mono text-center whitespace-nowrap border-b-2 ${
                                    activeTab === tab.id
                                        ? 'border-chalk text-chalk font-bold'
                                        : 'border-transparent text-muted'
                                }`}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </div>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8">
                        
                        {/* ================= TAB 1: STUDIO (PRACTICE + 14 SYLLABLE SELECTOR) ================= */}
                        {activeTab === 'studio' && (
                            <div className="space-y-6">
                                
                                {/* 14-SYLLABLE PILL STRIP */}
                                <div className="bg-charcoal border border-bordercolor p-4 rounded-xl space-y-3">
                                    <div className="flex items-center justify-between">
                                        <span className="text-xs font-mono text-muted uppercase tracking-wider">Select Syllable Problem (1 to 14)</span>
                                        <span className="text-xs font-mono text-chalk">Current Target: <strong className="text-white underline">{currentProblem} Syllable{currentProblem > 1 ? 's' : ''}</strong></span>
                                    </div>
                                    <div className="grid grid-cols-7 sm:grid-cols-14 gap-1.5">
                                        {Array.from({ length: 14 }, (_, i) => i + 1).map(num => {
                                            const stat = state.problemStats.find(s => s.id === num);
                                            const isWeak = stat && stat.attempts > 0 && (stat.correct / stat.attempts) < 0.6;
                                            const isSelected = currentProblem === num;
                                            return (
                                                <button
                                                    key={num}
                                                    onClick={() => setCurrentProblem(num)}
                                                    className={`relative py-2.5 text-xs font-mono font-bold rounded transition-all flex flex-col items-center justify-center border ${
                                                        isSelected
                                                            ? 'bg-chalk text-obsidian border-chalk shadow-lg'
                                                            : 'bg-surface text-muted border-bordercolor hover:border-chalk hover:text-chalk'
                                                    }`}
                                                >
                                                    <span>{num}</span>
                                                    {isWeak && !isSelected && (
                                                        <span className="absolute top-1 right-1 w-1.5 h-1.5 bg-red-400 rounded-full"></span>
                                                    )}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* PRACTICE MODES & TOPIC BAR */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-charcoal border border-bordercolor p-4 rounded-xl flex flex-col justify-between space-y-3">
                                        <label className="text-xs font-mono text-muted uppercase">Practice Mode</label>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                            {[
                                                { id: 'find', label: 'Find Rhyme' },
                                                { id: 'completion', label: 'Completion' },
                                                { id: 'chain', label: 'Rhyme Chain' },
                                                { id: 'scheme', label: 'Rhyme Scheme' },
                                                { id: 'reflex', label: 'Reflex Timer' }
                                            ].map(m => (
                                                <button
                                                    key={m.id}
                                                    onClick={() => setCurrentMode(m.id)}
                                                    className={`px-3 py-2 text-xs font-mono rounded border text-center transition-colors ${
                                                        currentMode === m.id
                                                            ? 'bg-surface border-chalk text-chalk font-bold'
                                                            : 'bg-obsidian border-bordercolor text-muted hover:text-chalk'
                                                    }`}
                                                >
                                                    {m.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-charcoal border border-bordercolor p-4 rounded-xl flex flex-col justify-between space-y-3">
                                        <label className="text-xs font-mono text-muted uppercase">Topic Context</label>
                                        <select
                                            value={currentTopic}
                                            onChange={(e) => setCurrentTopic(e.target.value)}
                                            className="w-full bg-obsidian border border-bordercolor text-chalk text-xs font-mono p-2.5 rounded focus:outline-none focus:border-chalk"
                                        >
                                            {TOPICS.map(t => (
                                                <option key={t} value={t}>{t}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                {/* WORKSPACE EXERCISE CARD */}
                                <div className="bg-charcoal border border-bordercolor rounded-xl p-6 md:p-8 space-y-6">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-bordercolor pb-4 gap-2">
                                        <div>
                                            <span className="text-xs font-mono text-muted">PROBLEM #{currentProblem} — {currentProblem} SYLLABLE TARGET</span>
                                            <h2 className="text-2xl font-bold tracking-tight mt-1 font-mono">{targetPhrase}</h2>
                                        </div>
                                        <div className="flex items-center space-x-2">
                                            <button
                                                onClick={() => setShowHint(!showHint)}
                                                className="px-3 py-1.5 text-xs font-mono border border-bordercolor rounded bg-surface hover:border-chalk text-muted hover:text-chalk transition-colors"
                                            >
                                                {showHint ? 'Hide Hint' : 'Show Hint'}
                                            </button>
                                            <button
                                                onClick={generateNewExercise}
                                                className="px-3 py-1.5 text-xs font-mono border border-bordercolor rounded bg-surface hover:border-chalk text-chalk transition-colors"
                                            >
                                                Next Prompt ↻
                                            </button>
                                        </div>
                                    </div>

                                    {showHint && (
                                        <div className="bg-obsidian border border-bordercolor p-3 rounded text-xs font-mono text-muted">
                                            💡 <strong className="text-chalk">Hint:</strong> Match the exact vowel sequence and ending cadence. Aim for {currentProblem} syllables with crisp phonetic cadence.
                                        </div>
                                    )}

                                    {/* INPUT FORM */}
                                    <form onSubmit={handleSubmit} className="space-y-4">
                                        <div className="relative">
                                            <textarea
                                                rows="3"
                                                value={userAnswer}
                                                onChange={(e) => setUserAnswer(e.target.value)}
                                                placeholder={`Type your ${currentProblem}-syllable rhyming bar here...`}
                                                className="w-full bg-obsidian border border-bordercolor rounded-lg p-4 text-chalk font-mono text-sm focus:outline-none focus:border-chalk resize-none"
                                            ></textarea>
                                            <div className="absolute bottom-3 right-3 flex items-center space-x-2 bg-surface border border-bordercolor px-2.5 py-1 rounded text-xs font-mono">
                                                <span className="text-muted">SYLLABLES:</span>
                                                <span className={`font-bold ${countSyllables(userAnswer) === currentProblem ? 'text-green-400' : 'text-amber-400'}`}>
                                                    {countSyllables(userAnswer)} / {currentProblem}
                                                </span>
                                            </div>
                                        </div>

                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-mono text-muted">
                                                {state.apiKey ? '✨ Powered by Gemini AI Evaluation' : '⚡ Using High-Precision Heuristic Evaluator (Add API key in Stats & Setup for AI)'}
                                            </span>
                                            <button
                                                type="submit"
                                                disabled={isEvaluating || !userAnswer.trim()}
                                                className="px-6 py-3 bg-chalk text-obsidian font-mono text-xs font-bold rounded hover:bg-white transition-all disabled:opacity-50"
                                            >
                                                {isEvaluating ? 'Evaluating Phonetics...' : 'Submit & Analyze Bar'}
                                            </button>
                                        </div>
                                    </form>

                                    {/* EVALUATION RESULTS CARD */}
                                    {lastResult && (
                                        <div className="mt-6 border border-bordercolor bg-obsidian rounded-xl p-6 space-y-6 animate-fadeIn">
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-bordercolor pb-4 gap-4">
                                                <div>
                                                    <span className="text-xs font-mono text-muted uppercase">Phonetic Score Assessment</span>
                                                    <div className="text-3xl font-bold font-mono mt-1">
                                                        {lastResult.totalScore} <span className="text-sm font-normal text-muted">/ 100</span>
                                                    </div>
                                                </div>
                                                <div className="flex items-center space-x-2">
                                                    <span className="px-3 py-1 bg-surface border border-bordercolor text-xs font-mono rounded">
                                                        Classification: <strong className="text-chalk">{lastResult.rhymeClassification}</strong>
                                                    </span>
                                                    <button
                                                        onClick={saveToVault}
                                                        className="px-3 py-1 bg-chalk text-obsidian text-xs font-mono font-bold rounded hover:bg-white"
                                                    >
                                                        Save to Vault ✦
                                                    </button>
                                                </div>
                                            </div>

                                            {/* BREAKDOWN METRICS */}
                                            <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 text-center">
                                                <div className="bg-surface border border-bordercolor p-3 rounded">
                                                    <div className="text-xs font-mono text-muted">Phonetic (35)</div>
                                                    <div className="text-lg font-bold font-mono mt-1">{lastResult.phoneticScore}</div>
                                                </div>
                                                <div className="bg-surface border border-bordercolor p-3 rounded">
                                                    <div className="text-xs font-mono text-muted">Syllables (20)</div>
                                                    <div className="text-lg font-bold font-mono mt-1">{lastResult.sylAccuracyScore}</div>
                                                </div>
                                                <div className="bg-surface border border-bordercolor p-3 rounded">
                                                    <div className="text-xs font-mono text-muted">Stress (15)</div>
                                                    <div className="text-lg font-bold font-mono mt-1">{lastResult.stressScore}</div>
                                                </div>
                                                <div className="bg-surface border border-bordercolor p-3 rounded">
                                                    <div className="text-xs font-mono text-muted">Originality (15)</div>
                                                    <div className="text-lg font-bold font-mono mt-1">{lastResult.originalityScore}</div>
                                                </div>
                                                <div className="bg-surface border border-bordercolor p-3 rounded col-span-2 sm:col-span-1">
                                                    <div className="text-xs font-mono text-muted">Usability (15)</div>
                                                    <div className="text-lg font-bold font-mono mt-1">{lastResult.usabilityScore}</div>
                                                </div>
                                            </div>

                                            {/* PRONUNCIATION & COACHING */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-mono">
                                                <div className="bg-surface border border-bordercolor p-4 rounded space-y-2">
                                                    <span className="text-muted uppercase">Pronunciation Analysis</span>
                                                    <div>Target: <code className="text-chalk">{lastResult.targetPronunciation}</code></div>
                                                    <div>Submission: <code className="text-chalk">{lastResult.subPronunciation}</code></div>
                                                </div>
                                                <div className="bg-surface border border-bordercolor p-4 rounded space-y-2">
                                                    <span className="text-muted uppercase">Coach Feedback</span>
                                                    <p className="text-chalk leading-relaxed">{lastResult.feedback}</p>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ================= TAB 2: WORDPLAY LAB ================= */}
                        {activeTab === 'wordplay' && (
                            <div className="space-y-6">
                                <div className="bg-charcoal border border-bordercolor p-6 rounded-xl space-y-3">
                                    <h2 className="text-xl font-mono font-bold">Advanced Wordplay Lab</h2>
                                    <p className="text-xs font-mono text-muted">
                                        Train double entendres, homophones, conceptual metaphors, and internal wordplay structures.
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {[
                                        { title: 'Double Entendre', desc: 'Construct a bar with two distinct conceptual interpretations.' },
                                        { title: 'Homophonic Switch', desc: 'Use words that sound identical but possess completely different meanings.' },
                                        { title: 'Extended Metaphor', desc: 'Maintain a single cohesive analogy across 4 connected bars.' }
                                    ].map((w, idx) => (
                                        <div key={idx} className="bg-charcoal border border-bordercolor p-6 rounded-xl flex flex-col justify-between space-y-4">
                                            <div className="space-y-2">
                                                <span className="text-xs font-mono text-muted">MODULE 0{idx + 1}</span>
                                                <h3 className="font-bold font-mono">{w.title}</h3>
                                                <p className="text-xs text-muted leading-relaxed">{w.desc}</p>
                                            </div>
                                            <button
                                                onClick={() => alert(`Launched ${w.title} drill. Practice your advanced lyricism!`)}
                                                className="w-full py-2 bg-surface border border-bordercolor text-xs font-mono rounded hover:border-chalk hover:text-chalk transition-colors"
                                            >
                                                Launch Drill →
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ================= TAB 3: VAULT (SAVED RHYMES & HISTORY) ================= */}
                        {activeTab === 'vault' && (
                            <div className="space-y-6">
                                <div className="bg-charcoal border border-bordercolor p-6 rounded-xl flex items-center justify-between">
                                    <div>
                                        <h2 className="text-xl font-mono font-bold">Personal Rhyme Vault</h2>
                                        <p className="text-xs font-mono text-muted mt-1">Saved bars, multisyllabic chains, and persistent practice history.</p>
                                    </div>
                                    <button
                                        onClick={() => {
                                            if (confirm("Clear all saved vault items?")) {
                                                setState(prev => ({ ...prev, savedRhymes: [] }));
                                            }
                                        }}
                                        className="px-4 py-2 bg-surface border border-bordercolor text-xs font-mono rounded text-red-400 hover:border-red-400"
                                    >
                                        Clear Vault
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {state.savedRhymes.length === 0 ? (
                                        <div className="col-span-2 bg-charcoal border border-bordercolor p-12 text-center rounded-xl text-xs font-mono text-muted">
                                            No saved rhymes in vault yet. Hit "Save to Vault" after evaluating any bar in the Studio.
                                        </div>
                                    ) : (
                                        state.savedRhymes.map(item => (
                                            <div key={item.id} className="bg-charcoal border border-bordercolor p-5 rounded-xl space-y-3 font-mono">
                                                <div className="flex items-center justify-between text-xs text-muted">
                                                    <span>Problem #{item.problem} • {item.topic}</span>
                                                    <span>Score: {item.score}/100</span>
                                                </div>
                                                <div className="text-sm font-bold text-chalk">"{item.phrase}"</div>
                                                <div className="text-xs text-muted">Target: {item.target}</div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ================= TAB 4: STATS & SETUP ================= */}
                        {activeTab === 'stats' && (
                            <div className="space-y-6">
                                
                                {/* GEMINI API CONFIGURATION */}
                                <div className="bg-charcoal border border-bordercolor p-6 rounded-xl space-y-4">
                                    <div className="flex items-center justify-between border-b border-bordercolor pb-3">
                                        <h2 className="text-lg font-mono font-bold">Gemini API Configuration</h2>
                                        <span className={`text-xs font-mono px-2 py-0.5 rounded ${state.apiKey ? 'bg-green-900/40 text-green-300 border border-green-700' : 'bg-surface text-muted'}`}>
                                            {state.apiKey ? 'API Key Active' : 'Offline Heuristic Mode'}
                                        </span>
                                    </div>

                                    <div className="space-y-3 font-mono text-xs">
                                        <label className="text-muted block">Gemini API Key</label>
                                        <div className="flex space-x-2">
                                            <input
                                                type={showApiKey ? 'text' : 'password'}
                                                value={state.apiKey}
                                                onChange={(e) => setState(prev => ({ ...prev, apiKey: e.target.value }))}
                                                placeholder="Enter your Gemini API key..."
                                                className="flex-1 bg-obsidian border border-bordercolor p-2.5 rounded text-chalk focus:outline-none focus:border-chalk"
                                            />
                                            <button
                                                onClick={() => setShowApiKey(!showApiKey)}
                                                className="px-4 py-2 bg-surface border border-bordercolor rounded text-muted hover:text-chalk"
                                            >
                                                {showApiKey ? 'Hide' : 'Show'}
                                            </button>
                                            <button
                                                onClick={testApiKey}
                                                className="px-4 py-2 bg-chalk text-obsidian font-bold rounded hover:bg-white"
                                            >
                                                {testStatus === 'testing' ? 'Testing...' : 'Test Connection'}
                                            </button>
                                        </div>
                                        {testStatus === 'success' && <p className="text-green-400">✓ API Connection Successful!</p>}
                                        {testStatus === 'error' && <p className="text-red-400">✗ Connection Failed. Check API Key.</p>}
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                                        <div className="space-y-2 font-mono text-xs">
                                            <label className="text-muted">Gemini Model</label>
                                            <select
                                                value={state.model}
                                                onChange={(e) => setState(prev => ({ ...prev, model: e.target.value }))}
                                                className="w-full bg-obsidian border border-bordercolor p-2.5 rounded text-chalk focus:outline-none focus:border-chalk"
                                            >
                                                <option value="gemini-2.5-flash">gemini-2.5-flash (Recommended)</option>
                                                <option value="gemini-2.5-pro">gemini-2.5-pro</option>
                                                <option value="gemini-1.5-flash">gemini-1.5-flash</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                {/* PERFORMANCE ANALYTICS BY PROBLEM */}
                                <div className="bg-charcoal border border-bordercolor p-6 rounded-xl space-y-4">
                                    <h2 className="text-lg font-mono font-bold">14-Problem Performance Breakdown</h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-3 font-mono">
                                        {state.problemStats.map(stat => {
                                            const acc = stat.attempts > 0 ? Math.round((stat.correct / stat.attempts) * 100) : 0;
                                            return (
                                                <div key={stat.id} className="bg-obsidian border border-bordercolor p-3 rounded-lg space-y-1">
                                                    <div className="text-xs text-muted flex justify-between">
                                                        <span>P#{stat.id}</span>
                                                        <span>{stat.attempts} tries</span>
                                                    </div>
                                                    <div className="text-base font-bold text-chalk">{acc}%</div>
                                                    <div className="text-[10px] text-muted">Accuracy</div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* DATA BACKUP / RESET */}
                                <div className="bg-charcoal border border-bordercolor p-6 rounded-xl flex items-center justify-between">
                                    <div className="space-y-1 font-mono">
                                        <h3 className="font-bold text-sm">Memory & Storage</h3>
                                        <p className="text-xs text-muted">All progress is stored locally in persistent browser memory.</p>
                                    </div>
                                    <button
                                        onClick={() => {
                                            if (confirm("Reset all history and progress?")) {
                                                localStorage.removeItem(STORAGE_KEY);
                                                setState(DEFAULT_STATE);
                                                window.location.reload();
                                            }
                                        }}
                                        className="px-4 py-2 bg-surface border border-bordercolor text-xs font-mono rounded text-red-400 hover:border-red-400"
                                    >
                                        Reset All Data
                                    </button>
                                </div>

                            </div>
                        )}

                    </main>

                    {/* FOOTER */}
                    <footer className="border-t border-bordercolor bg-charcoal/40 py-4 text-center font-mono text-xs text-muted">
                        RHYME LAB — ADVANCED MULTISYLLABIC RAP TRAINING STUDIO
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
